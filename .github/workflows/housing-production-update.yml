name: Housing Production candidate refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "31 16 10 * *"

permissions:
  contents: read

jobs:
  human-review-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Build candidate evidence
        run: python -m bay_outlook.cli build-phase14-production || true
      - name: Verify candidate structure
        run: python -m unittest tests.test_phase14_production
      - name: Report publication gates without deploying
        run: python -m bay_outlook.cli verify-phase14-production || true
      - name: Record review boundary
        run: |
          mkdir -p candidate-review
          cp data/phase14/production/exports/quality_checks.csv candidate-review/
          cp data/phase14/production/exports/source_freshness.csv candidate-review/
          cp data/phase14/production/exports/timeline_coverage.csv candidate-review/
          printf '%s\n' 'No public deployment is performed by this workflow.' > candidate-review/REVIEW_REQUIRED.txt
      - uses: actions/upload-artifact@v4
        with:
          name: housing-production-candidate-review
          path: candidate-review
