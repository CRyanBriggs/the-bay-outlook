[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-bay-outlook-public"
version = "1.1.0"
description = "Reproducible economic and housing intelligence for the nine-county San Francisco Bay Area"
requires-python = ">=3.11"
authors = [{name = "Ryan Briggs"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
